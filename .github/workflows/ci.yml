name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    # The committed lockfile is reviewed and pinned with integrity hashes, so CI
    # trusts it and skips re-applying the time-based supply-chain policies
    # (minimumReleaseAge / trustPolicy in pnpm-workspace.yaml) on every install.
    # Those policies still gate dependency adoption locally at `vp add` / `vp update`
    # resolution time; without this, CI fails for up to 24h after bumping to a
    # freshly published package (ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION).
    env:
      PNPM_CONFIG_TRUST_LOCKFILE: "true"
    steps:
      - uses: actions/checkout@v4
      # Installs Vite+, sets up Node.js (from .node-version) and the package
      # manager, caches installs, and runs `vp install` (run-install defaults to true).
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: .node-version
          cache: true
      - run: vp check
      - run: vp test
      # Dead code is a whole-project property, so nothing else catches it: a PR that deletes the
      # last consumer of an export adds no finding to its own diff. `vp run fallow` already exits
      # non-zero on any finding and takes ~0.1s, so it is a blocking step from the start — #20 took
      # the project to zero and this is what holds it there.
      #
      # `vp run doctor` deliberately does NOT join this job. react-doctor.yml already gates it with
      # `blocking: warning` + `scope: full`, and the two runs would not agree: package.json's
      # `doctor` script passes `--no-lint` while the action scans with lint (11 warnings vs 15 on
      # the pre-#20 tree — see #20). Two checks disagreeing about the same tool is worse than one.
      - run: vp run fallow
      - run: vp build
