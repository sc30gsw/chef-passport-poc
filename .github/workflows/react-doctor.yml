# React Doctor — finds security, performance, correctness, accessibility,
# bundle-size, and architecture issues in React codebases.
#
# Docs: https://www.react.doctor/ci
# Source: https://github.com/millionco/react-doctor

name: React Doctor

on:
  # Scans the PR's changed files and posts a sticky summary comment listing only the new issues introduced relative to the merge base of the target branch.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # Scans `main` on every push to track the health-score trend and catch regressions that slipped past PR review.
  push:
    branches: ["main"]

permissions:
  contents: read
  pull-requests: write
  issues: write
  statuses: write

# Cancels any in-flight scan for the same PR (or branch, on push) the moment a new commit arrives, so reviewers only ever see the latest run.
concurrency:
  group: react-doctor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  react-doctor:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 gives React Doctor the full git history it needs to find the merge base with the target branch. Without it a shallow checkout has no merge base, so PR runs can't compare against the base and fall back to reporting every issue in the changed files (pre-existing ones included) instead of only the ones the PR introduced.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Graduated from advisory to blocking by #20, which took the project to zero warnings.
      #
      # `blocking: warning`, not `error`: every finding this project has ever had was a *warning*
      # (unused exports, unused files, no-multi-comp), so `error` would gate on a severity nothing
      # here produces and would let the count drift back up unnoticed. Only `warning` pins zero.
      #
      # `scope: full`, not the changed-files default: dead code is a whole-project property. A PR
      # that deletes the last consumer of an export adds no finding to its own diff, and a
      # changed-files scan would miss it — which is precisely how the 18-warning baseline
      # accumulated. Full scan on a repo this size costs seconds.
      #
      # Files this gate must not judge (build output, vendored tool dirs) are excluded in
      # doctor.config.ts, which the action reads. Note the action runs *with* lint, unlike
      # package.json's `doctor` script — see #20's answer on `--no-lint`.
      - uses: millionco/react-doctor@v2
        with:
          blocking: warning
          scope: full
          # Pinned to the version in package.json's devDependencies. With `blocking: warning` an
          # unpinned `latest` means a react-doctor release can red-X an unrelated PR, and a local
          # run can disagree with CI. Bumping both together is a deliberate act, not a surprise.
          version: "0.5.8"
